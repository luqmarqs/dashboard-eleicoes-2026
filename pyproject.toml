[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tse2026"
version = "0.1.0"
description = "Coletor dos resultados por seção eleitoral das Eleições Gerais 2026 (TSE) a partir dos Boletins de Urna oficiais."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyarrow>=16",
    "polars>=1.0",
    "duckdb>=1.0",
    "pydantic>=2.6",
    "tenacity>=8.2",
    "rich>=13",
    "asn1tools>=0.166",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
dashboard = ["shapely>=2.0", "scipy>=1.11", "psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tse2026 = ["asn1/*.asn1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
