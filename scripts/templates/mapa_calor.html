<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..900&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: mapa em tela cheia; painel de leitura à esquerda (empilha embaixo no celular). */
:root {
  --bg: #f6f3f7; --panel: #ffffff; --ink: #241a2b; --muted: #6b5f72; --line: #e2dae6;
  --accent: #7b1fa2; --edge: #7b1fa2; --badge-bg: #241a2b; --badge-fg: #ffffff;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #17121b; --panel: #201927; --ink: #f1eaf4; --muted: #b3a6ba; --line: #352b3d;
    --accent: #d39cf0; --edge: #d39cf0; --badge-bg: #f1eaf4; --badge-fg: #17121b; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; }
.app { display: grid; grid-template-columns: minmax(300px, 370px) 1fr; height: 100%; }
.panel { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto;
  padding: 22px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-stretch: 85%; font-weight: 850; font-size: 28px; line-height: 1.04;
  margin: 4px 0 0; text-wrap: balance; }
label.sel { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
select { font: 600 15px var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 8px 10px; width: 100%; }
select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat b { display: block; font-family: var(--display); font-stretch: 90%; font-weight: 800; font-size: 24px;
  font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }
.ramp { height: 10px; border-radius: 2px;
  background: linear-gradient(90deg, rgba(255,214,64,.2), #ffd640 25%, #ff8a3d 50%, #e0306f 75%, #5b0f7a); }
.ramp-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px; }
h2 { font-family: var(--display); font-stretch: 90%; font-weight: 800; font-size: 14px; margin: 0 0 4px;
  text-transform: uppercase; letter-spacing: .04em; }
ol.rank { list-style: none; margin: 0; padding: 0; }
ol.rank button { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid;
  grid-template-columns: 24px 1fr auto; gap: 10px; align-items: baseline; padding: 6px 4px;
  border-bottom: 1px solid var(--line); }
ol.rank button:hover, ol.rank button:focus-visible { background: var(--bg); }
.r { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; }
.n { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.v { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; }
.v small { display: block; color: var(--muted); font-size: 11px; }
.note { font-size: 12px; color: var(--muted); line-height: 1.45; border-top: 1px solid var(--line); padding-top: 12px; margin: 0; }
.mapwrap { position: relative; min-width: 0; }
#map { position: absolute; inset: 0; }
.leaflet-container { font-family: var(--body); background: var(--bg); }
.badge { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
  background: var(--badge-bg); color: var(--badge-fg); font: 600 11px/1 var(--mono); box-shadow: 0 0 0 2px var(--panel); }
.badge.top3 { width: 26px; height: 26px; font-size: 12px; background: var(--accent); color: var(--panel); }
.leaflet-tooltip.lbl, .leaflet-tooltip.tip { background: var(--panel); color: var(--ink); border: 1px solid var(--line);
  box-shadow: none; font: 600 12px/1.25 var(--body); padding: 3px 6px; }
.leaflet-tooltip.tip { font-weight: 400; font-size: 13px; }
.leaflet-tooltip.lbl::before { display: none; }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 62vh auto; height: auto; }
  .mapwrap { grid-row: 1; height: 62vh; }
  .panel { grid-row: 2; border-right: 0; border-top: 1px solid var(--line); padding: 18px 16px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="title"></h1>
    </div>
    <label class="sel" id="sel-wrap" hidden>Camada
      <select id="sel"></select>
    </label>
    <div class="stats">
      <div class="stat"><b id="s-total">–</b><span id="s-total-l">votos</span></div>
      <div class="stat"><b id="s-pct">–</b><span>dos votos válidos do cargo</span></div>
    </div>
    <div>
      <div class="ramp"></div>
      <div class="ramp-labels"><span>poucos votos</span><span>concentração alta</span></div>
    </div>
    <div>
      <h2 id="rank-title"></h2>
      <ol class="rank" id="rank"></ol>
    </div>
    <p class="note" id="note"></p>
  </aside>
  <div class="mapwrap"><div id="map"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
<script>
const D = __DATA__;
const fmt = new Intl.NumberFormat("pt-BR");
const pct = (x) => (x * 100).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%";
const isCity = D.nivel === "bairro";
const AREA = isCity ? 3 : 4;          // índice do ponto: bairro ou município
const LABEL_ZOOM = isCity ? 13 : 9;   // a partir daqui os nomes ficam fixos
const DOT_ZOOM = isCity ? 14 : 12;    // a partir daqui aparecem os locais de votação

document.getElementById("eyebrow").textContent =
  (isCity ? "Município de " + D.escopo : "Estado de " + D.escopo) + " · 1º turno 2026";
document.getElementById("title").textContent = D.titulo;
document.getElementById("rank-title").textContent =
  D.topAreas + (isCity ? " bairros com mais votos" : " cidades com mais votos");
document.getElementById("note").textContent =
  "Votos: Boletins de Urna de todas as seções (TSE), conferidos com o resultado oficial. " +
  "Posição e bairro: cadastro de locais de votação do TSE (o bairro é o do local de votação, não o de moradia). " +
  (D.semCoord[0] ? fmt.format(D.semCoord[0]) + " locais sem coordenada foram colocados no centro do município. " : "") +
  "Fundo: Esri/OpenStreetMap. Limites: IBGE.";

const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
const map = L.map("map", { zoomSnap: 0.5, preferCanvas: true });
// Fundo cinza da Esri: funciona sem chave de API, inclusive abrindo o arquivo localmente.
const esri = (layer) => `https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/${layer}/MapServer/tile/{z}/{y}/{x}`;
const credit = "Fundo: Esri, HERE, Garmin, © OpenStreetMap · Limites: IBGE · Votos: TSE";
L.tileLayer(esri(dark ? "World_Dark_Gray_Base" : "World_Light_Gray_Base"), { maxZoom: 16, attribution: credit }).addTo(map);
L.tileLayer(esri(dark ? "World_Dark_Gray_Reference" : "World_Light_Gray_Reference"), { maxZoom: 16, pane: "overlayPane" }).addTo(map);
const edge = getComputedStyle(document.documentElement).getPropertyValue("--edge").trim();
const outline = L.geoJSON(D.geo, { style: { color: edge, weight: isCity ? 2 : 0.5, opacity: isCity ? 0.8 : 0.45, fill: false },
  interactive: false }).addTo(map);
map.fitBounds(outline.getBounds(), { padding: [10, 10] });

const heat = L.heatLayer([], { radius: isCity ? 18 : 14, blur: isCity ? 20 : 16, minOpacity: 0.25,
  gradient: { 0.2: "#ffd640", 0.45: "#ff8a3d", 0.7: "#e0306f", 1: "#5b0f7a" } }).addTo(map);
const badges = L.layerGroup().addTo(map);
const dots = L.layerGroup();

const sel = document.getElementById("sel");
if (D.series.length > 1) {
  document.getElementById("sel-wrap").hidden = false;
  const groups = {};
  D.series.forEach((s, i) => {
    const g = groups[s.cargo] ||= Object.assign(document.createElement("optgroup"), { label: s.cargoNome });
    g.appendChild(new Option(s.label, i));
  });
  Object.values(groups).forEach((g) => sel.appendChild(g));
}

function render(si) {
  const s = D.series[si];
  const ci = D.cargos.indexOf(s.cargo);
  const vals = D.points.map((p) => p[5][si]);
  const nz = vals.filter((v) => v > 0).sort((a, b) => a - b);
  // Teto da escala: no estado muitos locais se somam no mesmo ponto em zoom baixo, então o teto é maior.
  const q = (f) => (nz.length ? nz[Math.floor((nz.length - 1) * f)] : 1);
  heat.setOptions({ max: Math.max(isCity ? q(0.95) : q(0.995) * 4, 1) });
  heat.setLatLngs(D.points.filter((p, i) => vals[i] > 0).map((p) => [p[0], p[1], p[5][si]]));

  let total = 0, validos = 0;
  const areas = new Map();
  D.points.forEach((p) => {
    const v = p[5][si], val = p[6][ci];
    total += v; validos += val;
    const a = areas.get(p[AREA]) || { v: 0, val: 0, la: 0, lo: 0 };
    a.v += v; a.val += val; a.la += p[0] * v; a.lo += p[1] * v;
    areas.set(p[AREA], a);
  });
  document.getElementById("s-total").textContent = fmt.format(total);
  document.getElementById("s-total-l").textContent = "votos · " + s.cargoNome;
  document.getElementById("s-pct").textContent = validos ? pct(total / validos) : "–";

  const top = [...areas.entries()].filter(([, a]) => a.v > 0).sort((x, y) => y[1].v - x[1].v).slice(0, D.topAreas);
  badges.clearLayers();
  const rank = document.getElementById("rank");
  rank.replaceChildren();
  top.forEach(([name, a], i) => {
    const r = i + 1, ll = [a.la / a.v, a.lo / a.v];
    const nome = name.toLowerCase().replace(/(^|[\s(-])\S/g, (m) => m.toUpperCase())
      .replace(/ (D[aeo]s?|E) /g, (m) => m.toLowerCase());
    const mk = L.marker(ll, { icon: L.divIcon({ className: "", iconSize: null,
      html: `<div class="badge${r <= 3 ? " top3" : ""}">${r}</div>` }) })
      .bindTooltip(`${r}. ${nome}`, { className: "lbl", direction: "right", offset: [12, 0] });
    mk.on("click", () => map.flyTo(ll, Math.max(map.getZoom(), LABEL_ZOOM)));
    badges.addLayer(mk);
    const li = document.createElement("li");
    li.innerHTML = `<button type="button"><span class="r">${r}</span><span class="n"></span>` +
      `<span class="v">${fmt.format(a.v)}<small>${a.val ? pct(a.v / a.val) : "–"} dos válidos</small></span></button>`;
    li.querySelector(".n").textContent = nome;
    li.querySelector("button").addEventListener("click", () => { map.flyTo(ll, LABEL_ZOOM + 1, { duration: 0.8 }); });
    rank.appendChild(li);
  });

  dots.clearLayers();
  const vmax = nz.length ? nz[nz.length - 1] : 1;
  D.points.forEach((p) => {
    const v = p[5][si];
    if (!v) return;
    dots.addLayer(L.circleMarker([p[0], p[1]], { radius: 3 + 9 * Math.sqrt(v / vmax), color: edge, weight: 1,
      fillColor: edge, fillOpacity: 0.25 })
      .bindTooltip(`<b>${p[2]}</b><br>${p[3]}${isCity ? "" : " · " + p[4]}<br>${fmt.format(v)} votos · ` +
        `${p[6][ci] ? pct(v / p[6][ci]) : "–"} dos válidos`, { className: "tip" }));
  });
  syncZoom();
}

function syncZoom() {
  const z = map.getZoom();
  badges.eachLayer((mk) => {
    const t = mk.getTooltip();
    t.options.permanent = z >= LABEL_ZOOM;
    if (z >= LABEL_ZOOM) mk.openTooltip(); else mk.closeTooltip();
  });
  if (z >= DOT_ZOOM) map.addLayer(dots); else map.removeLayer(dots);
}
map.on("zoomend", syncZoom);
sel.addEventListener("change", () => render(+sel.value));
render(0);
</script>
</body>
</html>
